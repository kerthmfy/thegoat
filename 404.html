<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found · Kerth Yadao</title>
<link rel="icon" href="/thegoat/favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="dark">
<style>
/* GitHub Pages shows this page for any address under /thegoat/ that doesn't exist.
   Its links start with /thegoat/ because it can appear at any address.
   It's an iOS 6 alert box over a dimmed home screen. */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:grid;place-items:center;padding:24px 16px;color:#fff;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  background:
    radial-gradient(ellipse at 30% 15%,rgba(79,106,160,.55),transparent 60%),
    radial-gradient(ellipse at 80% 90%,rgba(43,63,107,.6),transparent 55%),
    linear-gradient(#18213a,#05070d);
}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.6))}
.alert{
  position:relative;width:min(290px,100%);padding:20px 16px 16px;text-align:center;border-radius:11px;
  border:2px solid rgba(225,232,245,.9);
  background:
    radial-gradient(ellipse 140% 60% at 50% -12%,rgba(255,255,255,.42),rgba(255,255,255,.07) 62%,transparent 63%),
    linear-gradient(rgba(42,62,110,.94),rgba(8,24,66,.94));
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 12px 34px rgba(0,0,0,.65);
  text-shadow:0 -1px 0 rgba(0,0,0,.6);
  animation:pop .35s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{from{transform:scale(.6);opacity:0}}
h1{margin:0 0 8px;font-size:18px;font-weight:700}
p{margin:0 0 18px;font-size:15px;line-height:1.35}
.btn{
  display:block;padding:10px;border-radius:6px;font-size:17px;font-weight:700;color:#fff;text-decoration:none;
  border:1px solid rgba(0,0,0,.55);
  background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,.12) 50%,rgba(255,255,255,.02) 51%,rgba(255,255,255,.14)),#3d5689;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 0 rgba(255,255,255,.18);
}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible{outline:2px solid #9ccaff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.alert{animation:none}}
</style>
</head>
<body>
  <div class="alert" role="alertdialog" aria-labelledby="t" aria-describedby="d">
    <h1 id="t">Page Not Found</h1>
    <p id="d">This page doesn't exist, or it moved. Maybe it's still on an old iPod somewhere.</p>
    <a class="btn" href="/thegoat/">OK</a>
  </div>
</body>
</html>
