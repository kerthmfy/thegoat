# Keeps the Films section up to date.
# Every day GitHub runs scripts/letterboxd.py, and if my Letterboxd diary
# has something new, it saves films.json and republishes the site.
#
# Run it by hand: GitHub → your repo → Actions → "Update films" → Run workflow.

name: Update films

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC (10:17 in Manila)
  workflow_dispatch:        # adds the "Run workflow" button
  push:
    paths:
      - ".github/workflows/letterboxd.yml"
      - "scripts/letterboxd.py"

permissions:
  contents: write   # to save films.json
  pages: write      # to ask GitHub Pages to republish

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read my Letterboxd diary
        run: python3 scripts/letterboxd.py kerthfyadao films.json

      - name: Save and republish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- films.json; then
            echo "No new films."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films.json
          git commit -m "Update films from Letterboxd"
          git push
          gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick it up on its next build."
