<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ======================================================================
     HOW TO WRITE A NEW NOTE
     1. Copy this file and rename it, e.g. notes/my-iphone-5-setup.html
        (lowercase, dashes instead of spaces).
     2. Change the four things marked ✏️ below and write your note.
     3. On index.html, search for "NEW NOTE?" and add a card that links here.
     Delete these comments whenever you like. Files starting with "_" are
     just templates; nobody will link to this one.
     ====================================================================== -->

<!-- ✏️ 1. Title for the browser tab -->
<title>Note title · Kerth's notes</title>
<!-- ✏️ 2. One sentence for search results and link previews -->
<meta name="description" content="One sentence about this note.">

<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="note.css">
</head>
<body>
<div class="sheet">

  <header class="leather"><a class="back" href="../#notes">Notes</a><span>Kerth's notes</span></header>

  <article class="paper">
    <!-- ✏️ 3. Date (both spots) and a topic -->
    <p class="date"><time datetime="2026-12-01">Dec 1, 2026</time> · Topic</p>
    <!-- ✏️ 4. The big handwritten title -->
    <h1>Note title</h1>

    <!-- Write below. Every paragraph goes in <p> … </p>. Some building blocks: -->

    <p>A normal paragraph. You can add <a href="https://example.com">a link</a>, <b>bold</b>, <i>italics</i> or <code>some code</code>.</p>

    <h2>A smaller heading</h2>

    <ul>
      <li>A bullet point</li>
      <li>Another one</li>
    </ul>

    <blockquote>A quote, or a thought you want to stand out.</blockquote>

    <!-- A photo taped to the page: put the image in the notes folder (or ../photos/) -->
    <figure>
      <img src="../cover.jpg" alt="Describe the photo for people who can't see it">
      <figcaption>A handwritten caption</figcaption>
    </figure>

    <!-- A block of commands or code: -->
    <pre><code>docker compose up -d</code></pre>
  </article>

  <footer class="sheet-foot"><a href="../#notes">‹ All notes</a><a href="../">Home</a></footer>
</div>
</body>
</html>
